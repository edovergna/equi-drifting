program: train.py

name: model_size_sweep_better
method: grid

entity: equivariant-drifting
project: model_size_sweep_better

metric:
  name: val_loss
  goal: minimize

parameters:
  num_layers:
    values: [1, 3, 5, 7, 9, 11]

  hidden_dim:
    values: [ 128, 256, 512]

command:
  - ${env}
  - python
  - ${program}
  - --n_real_molecules=128
  - --n_gen_molecules=128
  - --num_workers=8
  - --max_epochs=2000
  - --min_num_atoms=3
  - --max_num_atoms=12
  - --check_val_every_n_epoch=1
  - --max_iter=1
  - --sample_frac=1.0
  - --position_sigma=2.0
  - --types_sigma=1.0
  - --position_eta=1.0
  - --types_eta=1.0
  - --lr=1e-5
  - --position_weight=0.5
  - --chem_refinement
  - --group_tag=model_size_sweep_better
  - --auto_wandb_size_name
  - ${args}
