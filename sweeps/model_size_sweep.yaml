program: train.py

name: model_size_sweep_atoms8_sigma2_type1
method: grid

entity: equivariant-drifting
project: model_size_sweep_variety

metric:
  name: val_loss
  goal: minimize

parameters:
  num_layers:
    values: [5, 7, 9, 11]

  hidden_dim:
    values: [128, 256, 512]

command:
  - ${env}
  - python
  - ${program}
  - --n_real_molecules=128
  - --n_gen_molecules=128
  - --num_workers=8
  - --max_epochs=750
  - --min_num_atoms=3
  - --max_num_atoms=11
  - --check_val_every_n_epoch=1
  - --max_iter=1
  - --sample_frac=1.0
  - --position_sigma=2.0
  - --types_sigma=1.0
  - --position_eta=0.7
  - --types_eta=0.4
  - --lr=2e-4
  - --position_weight=0.5
  - --chem_refinement
  - --group_tag=model_size_sweep_atoms8_sigma2_type1
  - --auto_wandb_size_name
  - ${args}
